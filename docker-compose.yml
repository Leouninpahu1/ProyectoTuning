services:
  turning-web:
    build:
      context: ./src/turning.Web
      dockerfile: Dockerfile
    container_name: turning-web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    networks:
      - turning-network

networks:
  turning-network:
    driver: bridge